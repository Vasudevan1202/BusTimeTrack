<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Dashboard | BusTimeTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="dashboard-layout">
  
  <nav class="dashboard-nav">
    <div class="logo">BusTime<span>Track</span></div>
    <div class="user-profile">
      <span id="user-name">Passenger</span>
      <button class="btn btn-secondary btn-sm" id="logout-btn" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">Logout</button>
    </div>
  </nav>

  <div class="search-overlay">
    <div class="search-bar">
      <input type="text" id="bus-search" placeholder="Search Bus Number or Route">
      <button class="search-btn" id="search-action">🔍</button>
    </div>
  </div>

  <div id="map"></div>

  <div class="info-card-overlay glass-card" id="bus-info-card">
    <h3 id="info-bus-number" style="margin-bottom: 0.5rem;">Select a bus</h3>
    <div class="eta-box" id="info-eta">ETA: -- mins</div>
    <p id="info-next-stop" style="color: var(--text-light); font-size: 0.9rem;">Next Stop: --</p>
    <div style="margin-top: 1rem; font-size: 0.8rem; display: flex; justify-content: space-between;">
      <span>Crowd Level: <strong style="color: var(--success)">Low</strong></span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/map.js"></script>
</body>
</html>
