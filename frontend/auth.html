<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication | BusTimeTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <nav class="navbar">
    <a href="/" class="logo">BusTime<span>Track</span></a>
  </nav>

  <main class="auth-container">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <h2 id="auth-title">Welcome Back</h2>
        <p id="auth-subtitle">Login to your account to continue</p>
      </div>

      <!-- Role Selection (Hidden on Login by default, but keeping it visible for flexibility or only showing on signup) -->
      <div class="role-selector" id="role-selector" style="display: none;">
        <button class="role-btn active" data-role="passenger">Passenger</button>
        <button class="role-btn" data-role="owner">Bus Owner</button>
      </div>

      <form id="auth-form">
        <div id="name-group" class="form-group" style="display: none;">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe">
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div id="mobile-group" class="form-group" style="display: none;">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" class="form-control" placeholder="+1 234 567 8900">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Login</button>
      </form>

      <div class="switch-auth">
        <span id="switch-text">Don't have an account?</span>
        <a href="#" id="switch-link">Sign Up</a>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
